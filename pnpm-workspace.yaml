allowBuilds:
  '@scarf/scarf': set this to true or false
  bcrypt: true
  sqlite3: true
minimumReleaseAgeExclude:
  - minimatch@3.0.5
  - debug@3.2.7
  - diff@3.5.1
  - js-yaml@3.14.2
  - minimatch@3.1.3
  - minimatch@3.1.4
  - uuid@11.1.1
overrides:
  # Dev dependency fixes (mocha's transitive deps) - safe, same major versions
  diff: 8.0.3
  serialize-javascript: 7.0.5
  # Keep uuid at latest CJS-compatible version (sequelize uses CommonJS require)
  uuid: 9.0.1
